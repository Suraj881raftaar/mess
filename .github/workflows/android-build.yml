name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    - name: Setup Android SDK licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Restore Keystore and Environment Config
      run: |
        # 1. Restore debug keystore (from base64 or generate a standard debug keystore)
        if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi

        # 2. Ensure .env exists for Secrets Gradle Plugin
        if [ -f .env.example ] && [ ! -f .env ]; then
          cp .env.example .env
        elif [ ! -f .env ]; then
          touch .env
        fi

        # 3. Ensure gradlew is executable
        chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Office-Mess-Manager-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
